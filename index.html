<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ארץ האותיות</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Hebrew:wght@500;700;900&display=swap">
<style>
:root{
  --ink:#1F2A44; --ink-soft:#56627F;
  --sky:#BDE6F7; --sky-hi:#E3F5FC;
  --paper:#FFFDF7;
  --sun:#FFC93C; --grass:#5DBB63; --grass-deep:#3E9A48;
  --berry:#F0567A; --plum:#7B5CD6; --sea:#2FA7D6;
  --good:#3E9A48; --bad:#F0567A;
  --font:"Noto Sans Hebrew","Arial Hebrew","Arial",system-ui,sans-serif;
  --emoji:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
  --r:20px;
  color-scheme:light;
}
html,body{height:100%}
body{margin:0;background:var(--sky);color:var(--ink);font-family:var(--font);
  -webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;overscroll-behavior:none}
*{box-sizing:border-box}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:4px solid var(--sea);outline-offset:3px}

#app{min-height:100%;display:flex;flex-direction:column;padding-inline:16px;padding-block:14px 24px;
  position:relative;overflow-x:hidden;
  background:linear-gradient(to bottom,var(--sky-hi),var(--sky) 60%)}
/* sun and hill scenery */
#app::before{content:"";position:fixed;width:170px;height:170px;border-radius:50%;
  background:var(--sun);top:-60px;left:-50px;box-shadow:0 0 0 18px rgba(255,201,60,.25);z-index:0}
#app::after{content:"";position:fixed;left:-15%;right:-15%;bottom:-6vh;height:22vh;min-height:110px;
  background:var(--grass);border-radius:50% 50% 0 0 / 100% 100% 0 0;z-index:0;
  box-shadow:inset 0 10px 0 var(--grass-deep)}

.screen{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;gap:18px;
  width:100%;max-width:880px;margin-inline:auto}

/* chunky toy block look */
.block{background:var(--paper);border:3px solid var(--ink);border-radius:var(--r);
  box-shadow:0 6px 0 var(--ink);transition:transform .08s,box-shadow .08s}
button.block:active:not(:disabled){transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}

/* ---------- home ---------- */
.logo-wrap{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.abc{display:flex;gap:10px;direction:rtl}
.abc span{width:62px;height:62px;display:grid;place-items:center;font-size:40px;font-weight:900;
  border:3px solid var(--ink);border-radius:14px;box-shadow:0 5px 0 var(--ink);color:var(--paper)}
.abc span:nth-child(1){background:var(--berry);transform:rotate(-8deg)}
.abc span:nth-child(2){background:var(--sea);transform:rotate(4deg) translateY(-6px)}
.abc span:nth-child(3){background:var(--grass-deep);transform:rotate(-3deg)}
h1{margin:0;font-size:clamp(40px,9vw,68px);font-weight:900;line-height:1.25;text-align:center;
  text-wrap:balance;letter-spacing:.5px}
.turn{margin:0;text-align:center;font-size:24px;font-weight:700;color:var(--ink-soft)}
.players{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:6px}
.player{display:flex;flex-direction:column;align-items:center;gap:6px;padding:22px 12px 18px}
.player .face{font-family:var(--emoji);font-size:clamp(64px,16vw,96px);line-height:1.1}
.player .pname{font-size:clamp(28px,6vw,40px);font-weight:900}
.player .pstars{font-size:20px;font-weight:700;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.player[data-p="gan"]{background:#FFF1C7}
.player[data-p="kita"]{background:#E7E0FB}
.home-foot{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}
.pill{padding:10px 18px;font-size:18px;font-weight:700;border-radius:999px}
.note{margin:0 auto;max-width:520px;text-align:center;font-size:16px;color:var(--ink-soft);
  background:var(--paper);border:2px dashed var(--ink-soft);border-radius:14px;padding:10px 14px}

/* ---------- top bars ---------- */
.bar{display:flex;align-items:center;gap:12px}
.bar .grow{flex:1;min-width:0}
.icon-btn{width:58px;height:58px;display:grid;place-items:center;font-size:28px;font-family:var(--emoji);flex:none}
.who{font-size:26px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.starcount{display:flex;align-items:center;gap:6px;padding:8px 14px;font-size:24px;font-weight:900;
  font-variant-numeric:tabular-nums;background:var(--sun);border-radius:999px;flex:none}
.starcount.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.25) rotate(-6deg)}}

/* ---------- menu ---------- */
.menu-title{margin:4px 0 0;font-size:30px;font-weight:900;text-align:center}
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:18px}
.game-card{display:flex;flex-direction:column;align-items:center;gap:8px;padding:18px 10px 16px;text-align:center}
.game-card .gicon{width:96px;height:96px;display:grid;place-items:center;border-radius:18px;
  border:3px solid var(--ink);font-size:48px;font-weight:900;color:var(--paper);line-height:1}
.game-card .gicon.emo{font-family:var(--emoji);color:var(--ink)}
.game-card .gicon.sm{font-size:32px;letter-spacing:1px}
.game-card .gname{font-size:24px;font-weight:900;line-height:1.3}
.lvl{display:flex;gap:5px}
.lvl i{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--paper)}
.lvl i.on{background:var(--sun)}

/* ---------- game ---------- */
.dots{display:flex;gap:5px;justify-content:center;flex-wrap:wrap}
.dots i{width:16px;height:16px;border-radius:50%;border:3px solid var(--ink);background:var(--paper)}
.dots i.done{background:var(--sun)}
.dots i.now{background:var(--sky-hi);transform:scale(1.2)}
.prompt{min-height:36px;margin:0;text-align:center;font-size:clamp(22px,5vw,30px);font-weight:700;text-wrap:balance}
.stage{display:flex;flex-direction:column;align-items:center;gap:14px}
.pic{font-family:var(--emoji);font-size:clamp(96px,26vw,170px);line-height:1.1;padding:10px 26px;
  background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink)}
button.pic:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ink)}
.bigword{font-size:clamp(56px,15vw,110px);font-weight:900;line-height:1.35;padding:6px 30px;
  background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink)}
.hint{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:700}
.hint b{font-size:56px;line-height:1.2;padding:0 16px;background:var(--paper);border:3px solid var(--ink);border-radius:14px}
.hint b.emo{font-family:var(--emoji);font-weight:400;font-size:48px}

.choices{display:grid;gap:16px;grid-template-columns:repeat(3,1fr);margin-top:auto}
.choices.n4{grid-template-columns:repeat(4,1fr)}
.choices.n2{grid-template-columns:repeat(2,minmax(0,220px));justify-content:center}
.choices.words{grid-template-columns:1fr}
@media (min-width:640px){.choices.words{grid-template-columns:repeat(3,1fr)}.choices.words.w4{grid-template-columns:repeat(2,1fr)}}
@media (max-width:520px){.choices.n4{grid-template-columns:repeat(2,1fr)}}
.choice{min-height:120px;display:grid;place-items:center;padding:8px;font-weight:900;line-height:1.3;
  font-size:clamp(56px,14vw,100px)}
.choice.emo{font-family:var(--emoji);font-weight:400}
.choice.word{font-size:clamp(38px,8vw,56px);min-height:96px}
.choice.num{font-variant-numeric:tabular-nums}
.choice.right{background:#C9F0C4;border-color:var(--good);box-shadow:0 6px 0 var(--good);animation:pop .45s}
.choice.wrong,.tile.wrong{animation:shake .4s}
.choice:disabled.wrong{opacity:.35}
@keyframes pop{50%{transform:scale(1.1)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}

/* counting */
.count-field{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;max-width:640px;
  padding:14px;background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink)}
.cnt{position:relative;width:76px;height:76px;font-size:54px;font-family:var(--emoji);border:0;background:none;padding:0}
.cnt b{position:absolute;top:-4px;right:-4px;min-width:30px;height:30px;border-radius:15px;display:grid;place-items:center;
  background:var(--berry);color:var(--paper);font-family:var(--font);font-size:18px;border:2px solid var(--ink)}
.cnt.on{transform:scale(.9)}

/* math */
.choices.groups{grid-template-columns:1fr 1fr}
.choice.group{min-height:220px;font-family:var(--emoji);font-weight:400;font-size:clamp(30px,8vw,48px);line-height:1.25;padding:12px}
.eq{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px;padding:14px;max-width:100%;
  background:var(--paper);border:3px solid var(--ink);border-radius:28px;box-shadow:0 6px 0 var(--ink)}
.eq .grp{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;max-width:260px;padding:6px;border:2px dashed var(--ink-soft);border-radius:16px}
.eq .cnt{width:46px;height:50px;font-size:34px}
.eq .cnt .ghost{opacity:.3}
.eq .cnt.gone::after{content:"✖";position:absolute;inset:0;display:grid;place-items:center;color:var(--berry);font-family:var(--font);font-size:44px;font-weight:900}
.eq .op{font-size:48px;font-weight:900;padding-inline:4px}
.equation{font-variant-numeric:tabular-nums;white-space:nowrap;font-size:clamp(54px,15vw,100px)}
.dots-help{font-family:var(--emoji);font-size:26px;letter-spacing:2px;text-align:center}
.seq{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.seq span{min-width:64px;height:78px;padding-inline:8px;display:grid;place-items:center;font-size:clamp(30px,8vw,44px);font-weight:900;
  font-variant-numeric:tabular-nums;background:var(--paper);border:3px solid var(--ink);border-radius:16px;box-shadow:0 5px 0 var(--ink)}
.seq span.hole{background:var(--sun)}

/* colors, shapes, patterns, shadows */
.choice.swatch{background:var(--c);min-height:120px}
.choice.swatch.right{background:var(--c)}
.choice.swatch.right::after{content:"✔";font-size:56px;color:#fff;text-shadow:0 0 6px #000}
.choice.shape svg{width:min(100%,110px);height:auto;display:block}
.pattern{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;padding:10px;max-width:100%;
  background:var(--paper);border:3px solid var(--ink);border-radius:24px;box-shadow:0 6px 0 var(--ink)}
.pattern span{font-family:var(--emoji);font-size:clamp(26px,7.5vw,52px);line-height:1.2}
.pattern.long span{font-size:clamp(22px,6vw,44px)}
.pattern span.hole{font-family:var(--font);font-weight:900;color:var(--ink);background:var(--sun);border-radius:12px;padding-inline:10px}
.pic.shadow .sil{filter:brightness(0)}

.bigword.small{font-size:clamp(40px,11vw,72px);padding:2px 22px}
.bigword.sentence{font-size:clamp(30px,8vw,54px);line-height:1.5;text-align:center;text-wrap:balance;max-width:100%}
.slot.shown{background:var(--paper);animation:none}
.choice.sign{direction:ltr;unicode-bidi:isolate}
.equation{white-space:pre}
.equation.cmp{font-size:clamp(30px,9vw,80px);padding-inline:18px}

/* memory */
.memory{display:grid;gap:10px;grid-template-columns:repeat(3,1fr);width:100%;max-width:620px;margin:auto}
.memory.m8,.memory.m12,.memory.m16{grid-template-columns:repeat(4,1fr)}
.mcard{position:relative;height:clamp(96px,24vw,140px);padding:4px;background:var(--plum)}
.memory.m12 .mcard{height:clamp(84px,20vw,124px)}
.memory.m16 .mcard{height:clamp(72px,17vw,112px)}
.mcard .back{font-size:clamp(34px,9vw,54px);font-weight:900;color:var(--paper)}
.mcard .front{display:none;line-height:1.2;word-break:break-word}
.mcard .front.emo{font-family:var(--emoji);font-size:clamp(40px,11vw,64px)}
.mcard .front.letter{font-size:clamp(44px,12vw,72px);font-weight:900}
.mcard .front.word{font-size:clamp(20px,5.2vw,32px);font-weight:900}
.mcard.up{background:var(--paper);animation:flip .25s}
.mcard.up .back{display:none}
.mcard.up .front{display:block}
.mcard.done{background:#C9F0C4;border-color:var(--good);box-shadow:0 6px 0 var(--good)}
@keyframes flip{from{transform:rotateY(90deg)}}

/* build a word */
.slots{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.slot{width:clamp(70px,17vw,100px);height:clamp(84px,20vw,116px);display:grid;place-items:center;
  border:3px dashed var(--ink-soft);border-radius:18px;font-size:clamp(44px,11vw,66px);font-weight:900;background:rgba(255,253,247,.5)}
.slot.full{border-style:solid;border-color:var(--ink);background:#C9F0C4;animation:pop .3s}
.tiles{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-top:auto}
.tile{width:clamp(80px,19vw,112px);height:clamp(92px,22vw,124px);font-size:clamp(46px,11vw,70px);font-weight:900;line-height:1.3;
  background:#FFF1C7}
.tile.used{visibility:hidden}
.tiles.many{gap:10px}
.tiles.many .tile{width:clamp(66px,15vw,96px);height:clamp(78px,18vw,108px);font-size:clamp(38px,9vw,58px)}
.slots.many{gap:6px}
.slots.many .slot{width:clamp(44px,11vw,84px);height:clamp(60px,14vw,100px);font-size:clamp(30px,7.5vw,56px);border-radius:12px}
.lvlchip{align-self:center;display:flex;align-items:center;gap:8px;padding:4px 14px;font-size:18px;font-weight:700;
  background:var(--paper);border:2px solid var(--ink);border-radius:999px;margin-block:-6px}
.lvlchip .lvl i{width:12px;height:12px}
.lvlup{position:fixed;top:38%;left:50%;z-index:60;transform:translate(-50%,-50%);padding:18px 34px;white-space:nowrap;
  font-size:clamp(36px,9vw,60px);font-weight:900;background:var(--sun);border:4px solid var(--ink);border-radius:26px;
  box-shadow:0 8px 0 var(--ink);pointer-events:none}
.lvlup.show{animation:lvlpop 1.9s ease-out forwards}
@keyframes lvlpop{0%{transform:translate(-50%,-50%) scale(.3)}15%{transform:translate(-50%,-50%) scale(1.1)}25%,80%{transform:translate(-50%,-50%) scale(1);opacity:1}100%{transform:translate(-50%,-50%) scale(1);opacity:0}}
.tile.glow,.choice.glow{animation:glow 1s infinite}
.together-btn{display:flex;align-items:center;justify-content:center;gap:12px;padding:14px 18px;font-size:clamp(24px,6vw,32px);font-weight:900;
  background:linear-gradient(90deg,#FFF1C7,#E7E0FB)}
.together-btn .faces{font-family:var(--emoji);font-weight:400;font-size:clamp(32px,8vw,44px)}
.team{display:flex;flex-direction:column;align-items:center;gap:8px}
.turn-tag{padding:6px 18px;border:3px solid var(--ink);border-radius:999px;font-size:clamp(22px,5.5vw,28px);font-weight:900;animation:pop .4s}
.turn-tag.gan{background:#FFF1C7}
.turn-tag.kita{background:#E7E0FB}
.road{display:flex;align-items:center;gap:4px;direction:rtl}
.road i{width:clamp(24px,6.5vw,34px);height:clamp(24px,6.5vw,34px);border-radius:50%;border:2px solid var(--ink);background:var(--paper);
  display:grid;place-items:center;font-style:normal;font-family:var(--emoji);font-size:clamp(14px,4vw,20px)}
.road i.now{background:var(--sun);transform:scale(1.15)}
.road i.done{background:#C9F0C4}
.road b{font-family:var(--emoji);font-weight:400;font-size:clamp(26px,7vw,38px)}
.who-next{display:flex;align-items:center;gap:8px;font-family:var(--emoji);font-size:28px}
.who-next .pbar{flex:1}
.who-next .album-next{font-family:var(--font);font-size:15px}
@keyframes glow{50%{background:var(--sun)}}

/* done + album */
.done{align-items:center;justify-content:center;text-align:center}
.done .big{font-size:clamp(90px,24vw,150px);font-family:var(--emoji);line-height:1.1;animation:spin 1.2s ease-out}
@keyframes spin{from{transform:scale(.2) rotate(-180deg)}}
.done h2{margin:0;font-size:clamp(36px,8vw,54px);font-weight:900}
.done .gain{font-size:28px;font-weight:700}
.newstick{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 22px;background:#FFF1C7}
.newstick .row{font-family:var(--emoji);font-size:56px;display:flex;flex-wrap:wrap;justify-content:center;gap:10px}
.actions{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.actions button{padding:14px 26px;font-size:24px;font-weight:900}
.actions .go{background:var(--grass);color:var(--paper)}

.pages{display:flex;flex-direction:column;gap:18px}
.page{padding:12px 14px 16px}
.page h3,.trophy-shelf h3{margin:0 0 10px;font-size:22px;font-weight:900}
.page h3 small{font-size:16px;color:var(--ink-soft)}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.album span{aspect-ratio:1;max-width:100%;display:grid;place-items:center;font-size:40px;font-family:var(--emoji);
  border-radius:16px;background:var(--sky-hi);border:2px solid var(--ink)}
.album span.locked{font-family:var(--font);font-size:34px;font-weight:900;color:var(--ink-soft);background:#E4E8EF;border-style:dashed}
.album span.gold{background:linear-gradient(135deg,#FFE58A,#FFC93C 60%,#F5A623);border-color:#B7791F;box-shadow:0 0 0 2px #FFE58A inset}
.album span.locked.gold{font-family:var(--emoji);font-size:26px;background:#FFF4CC;border-color:#D9A640}
.album-next{text-align:center;font-size:20px;font-weight:700;margin:6px 0 0}
.pbar{position:relative;height:22px;max-width:420px;margin:0 auto;background:var(--paper);border:3px solid var(--ink);border-radius:999px;overflow:visible}
.pbar i{display:block;height:100%;background:var(--sun);border-radius:999px;transition:width .6s}
.pbar span{position:absolute;left:-14px;top:50%;transform:translateY(-50%);font-family:var(--emoji);font-size:30px}
.trophy-shelf{padding:12px 14px 16px}
.shelf,.trophies .row{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:10px}
.trophy{display:flex;flex-direction:column;align-items:center;gap:2px;text-align:center}
.trophy b{font-family:var(--emoji);font-weight:400;font-size:40px;line-height:1.2}
.trophy small{font-size:13px;font-weight:700;line-height:1.25}
.trophy.locked{opacity:.45}
.trophies .row{font-size:inherit;width:100%}
.bonuses{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:6px 12px;border:2px solid var(--ink);border-radius:999px;background:var(--paper);font-weight:700;font-size:18px}
.newstick .row span{display:inline-grid;place-items:center;width:84px;height:84px;border-radius:18px;background:var(--paper);border:3px solid var(--ink);
  animation:reveal .7s both}
.newstick .row span.gold{background:linear-gradient(135deg,#FFE58A,#FFC93C 60%,#F5A623);box-shadow:0 0 18px 4px #FFE58A}
.newstick.trophies{width:min(440px,100%)}
.newstick.trophies .row span{width:auto;height:auto;border:0;background:none;animation:reveal .7s .3s both}
@keyframes reveal{0%{transform:scale(0) rotate(-200deg);opacity:0}70%{transform:scale(1.2) rotate(8deg);opacity:1}100%{transform:none}}
.done-next{width:100%}

/* confetti */
.confetti{position:fixed;left:50%;top:40%;width:14px;height:14px;border-radius:3px;z-index:50;pointer-events:none;
  animation:fly .95s ease-out forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rot));opacity:0}}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}
</style>
</head>
<body>
<div id="app" dir="rtl" lang="he">

  <section id="home" class="screen">
    <div class="logo-wrap">
      <div class="abc" aria-hidden="true"><span>א</span><span>ב</span><span>ג</span></div>
      <h1>אֶרֶץ הָאוֹתִיּוֹת</h1>
      <p class="turn">לְמִי הַתּוֹר?</p>
    </div>
    <div class="players">
      <button class="player block" data-p="gan" id="p-gan">
        <span class="face">🐣</span><span class="pname">גַּן</span><span class="pstars"></span>
      </button>
      <button class="player block" data-p="kita" id="p-kita">
        <span class="face">🦉</span><span class="pname">כִּתָּה א׳</span><span class="pstars"></span>

/* Voice: pre-recorded clips (voice/voice.js, made by tools/make_voice.py) are
   played when they exist. Anything without a clip falls back to the device's
   own Hebrew text-to-speech. Each utterance is a list of phrases; the clips
   are played back to back. */
const CLIPS = window.VOICE_CLIPS || null;
const missingClips = new Set(); // phrases asked for that have no clip (see console: missingClips)
window.missingClips = missingClips;
let heVoice = null;
const canSpeak = 'speechSynthesis' in window;
function loadVoices() {
  if (!canSpeak) return;
  heVoice = speechSynthesis.getVoices().find(v => /^(he|iw)/i.test(v.lang)) || null;
}
if (canSpeak) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
const hasVoice = () => !!(CLIPS || heVoice);
// let the game's sound play even when an iPhone's ring/silent switch is on silent
try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
setTimeout(() => { $('#voiceNote').hidden = hasVoice(); }, 1500);

let ac = null;
function audioCtx() {
  ac = ac || new (window.AudioContext || window.webkitAudioContext)();
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
// phones only allow sound after a tap, so wake the audio engine on the first one
document.addEventListener('pointerdown', () => { try { audioCtx(); } catch (e) {} }, true);

const clipCache = new Map();
function clipBuffer(key) {
  if (!clipCache.has(key)) {
    const bin = atob(CLIPS[key]);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    clipCache.set(key, new Promise((ok, fail) => audioCtx().decodeAudioData(bytes.buffer, ok, fail)));
  }
  return clipCache.get(key);
}
let playing = [], queueEnd = 0, playToken = 0;
function stopVoice() {
  playToken++;
  for (const s of playing) { try { s.stop(); } catch (e) {} }
  playing = []; queueEnd = 0;
  if (canSpeak) speechSynthesis.cancel();
}

function speakTTS(text, queue) {

async function speak(parts, queue) {

  if (CLIPS) missing.forEach(p => missingClips.add(p));
  if (missing.length) return speakTTS(parts.map(sayAs).join(' '), queue);
  const token = playToken;

      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.28);

    }
    choices([{ label: ch, ok: true }, ...others.map(x => ({ label: x }))]);
    return { prompt: `אֵיפֹה הָאוֹת ${name}?`, say: `אֵיפֹה הָאוֹת ${name}?`, after: name };
  },

  count() {
    const min = L('min'), max = L('max');
    let n; do { n = min + Math.floor(Math.random() * (max - min + 1)); } while (n === S.lastN && max > min);
    S.lastN = n;
    const [item, itemName] = rand(COUNT_ITEMS);
    const field = document.createElement('div'); field.className = 'count-field';
    const things = Array(n).fill(item);
    if (L('mixed')) { // add 2-4 other things that should not be counted
      const extra = rand(COUNT_ITEMS.filter(c => c[0] !== item))[0];
      things.push(...Array(2 + Math.floor(Math.random() * 3)).fill(extra));
    }
    let counted = 0;
    for (const t of shuffle(things)) {
      const b = document.createElement('button'); b.className = 'cnt'; b.textContent = t;
      b.onclick = () => {
        if (b.classList.contains('on')) return;
        if (t !== item) { b.classList.remove('wrong'); void b.offsetWidth; b.classList.add('wrong'); return; }
        counted++; b.classList.add('on');
        const tag = document.createElement('b'); tag.textContent = counted; b.appendChild(tag);
        sfx('pop'); speak(NUMS[counted]);
      };
      field.appendChild(b);
    }
    if (L('mixed')) {
      const h = document.createElement('div'); h.className = 'hint';
      h.innerHTML = `סוֹפְרִים רַק אֶת: <b class="emo">${item}</b>`;
      $('#stage').appendChild(h);
    }
    $('#stage').appendChild(field);
    const others = sample([-3, -2, -1, 1, 2, 3].map(d => n + d).filter(x => x >= 1 && x <= 10), L('options') - 1);
    choices([{ label: String(n), ok: true }, ...others.map(x => ({ label: String(x) }))], 'num');
    return {
      prompt: 'כַּמָּה יֵשׁ? נוֹגְעִים וְסוֹפְרִים',
      say: `כַּמָּה ${itemName} יֵשׁ?`,
      after: n === 1 ? [NUMS[n]] : [NUMS[n], itemName]
    };
  },

  firstLetter() {
    const w = pickWord(wordPool([1, L('maxLen')]));
    picture(w, true);
    if (!hasVoice()) {
      const t = document.createElement('div'); t.className = 'hint'; t.innerHTML = `<b>${w.w}</b>`;
      $('#stage').appendChild(t);
    }
    const n = L('options');
    const ok = x => x !== w.first && !soundsAlike(x, w.first);
    let others = L('lookalike') ? sample([...new Set(LOOKALIKE.filter(g => g.includes(w.first)).flat())].filter(ok), n - 1) : [];
    others = others.concat(sample(ALL_LETTERS.filter(x => ok(x) && !others.includes(x)), n - 1 - others.length));
    choices([{ label: w.first, ok: true }, ...others.map(x => ({ label: x }))]);
    return {
      prompt: 'בְּאֵיזוֹ אוֹת מַתְחִילָה הַמִּלָּה?',
      say: ['בְּאֵיזוֹ אוֹת מַתְחִילָה הַמִּלָּה', w.w],
      after: [w.w, 'מַתְחִילָה בָּאוֹת', LETTER_NAME[w.first]]
    };
  },

  sound() {
    const w = pickWord(wordPool([1, L('maxLen')]).filter(w => vowelClass(w.chunks[0])));
    picture(w, true);
    const first = w.chunks[0], base = baseOf(first), v = vowelClass(first), n = L('options');
    const opts = new Set([first]);
    // same letter, another vowel
    for (const ov of shuffle(Object.keys(VOWEL).filter(x => x !== v))) {
      if (opts.size >= (n >= 4 ? 3 : 2)) break;
      opts.add(base + VOWEL[ov]);
    }
    // another letter, same vowel
    const pool2 = ['מ', 'ל', 'נ', 'ר', 'ד', 'ג', 'ז', 'י', 'ס', 'ה', 'שׁ', 'ק', 'צ']
      .filter(x => x[0] !== base[0] && !soundsAlike(x[0], base[0]));
    while (opts.size < n) opts.add(rand(pool2) + VOWEL[v]);
    choices([...opts].map(o => ({ label: o, ok: o === first })));
    return { prompt: 'מָה הַצְּלִיל הָרִאשׁוֹן?', say: ['מָה הַצְּלִיל הָרִאשׁוֹן בַּמִּלָּה', w.w], after: w.w };
  },

  read() {
    const w = pickWord(wordPool(L('lens')));
    const big = document.createElement('div'); big.className = 'bigword'; big.textContent = w.w;
    $('#stage').appendChild(big);
    const others = sample(WORDS.filter(x => x.e !== w.e), L('options') - 1);
    choices([{ label: w.e, ok: true }, ...others.map(x => ({ label: x.e }))], 'emo');
    return { prompt: 'אֵיזוֹ תְּמוּנָה מַתְאִימָה לַמִּלָּה?', say: 'אֵיזוֹ תְּמוּנָה מַתְאִימָה לַמִּלָּה?', after: w.w };
  },

  pick() {
    const w = pickWord(wordPool(L('lens')));
    picture(w, false);
    const k = L('options') - 1;
    let pool = WORDS.filter(x => x.w !== w.w);
    if (L('sameStart')) { // harder: distractors that start with the same letter, so the whole word must be read
      const same = pool.filter(x => x.first === w.first);
      pool = same.length >= k ? same : pool.filter(x => Math.abs(x.len - w.len) <= 1);
    }
    const others = sample(pool, k);
    choices([{ label: w.w, ok: true }, ...others.map(x => ({ label: x.w }))], 'word');
    return { prompt: 'אֵיזוֹ מִלָּה מַתְאִימָה לַתְּמוּנָה?', say: 'אֵיזוֹ מִלָּה מַתְאִימָה לַתְּמוּנָה?', after: w.w };
  },

  build() {
    const w = pickWord(wordPool(L('lens')).filter(w => w.chunks.length >= 2));
    picture(w, true);
    const slots = document.createElement('div'); slots.className = 'slots';
    const slotEls = w.chunks.map(() => { const s = document.createElement('div'); s.className = 'slot'; slots.appendChild(s); return s; });
    $('#stage').appendChild(slots);
    // higher levels mix in extra tiles that are not part of the word
    const decoys = sample([...new Set(WORDS.flatMap(x => x.chunks))].filter(c => !w.chunks.includes(c)), L('decoys'));
    let order; do { order = shuffle(w.chunks.concat(decoys)); } while (order.join() === w.chunks.join() && new Set(w.chunks).size > 1);
    const box = $('#choices'); box.className = 'tiles' + (order.length > 6 ? ' many' : ''); box.innerHTML = '';
    slots.classList.toggle('many', w.chunks.length > 5);
    let pos = 0;
    const tiles = order.map(c => {
      const b = document.createElement('button'); b.className = 'block tile'; b.textContent = c;
      b.onclick = () => {
        if (S.locked) return;
        if (c === w.chunks[pos]) {
          b.classList.add('used'); b.classList.remove('glow');
          slotEls[pos].textContent = c; slotEls[pos].classList.add('full');
          pos++; sfx('pop');
          if (pos === w.chunks.length) win();
        } else {
          miss(b);
          if (S.misses >= 2) { const t = tiles.find(t => !t.classList.contains('used') && t.textContent === w.chunks[pos]); t && t.classList.add('glow'); }
        }
      };
      box.appendChild(b); return b;
    });
    return { prompt: 'בּוֹנִים אֶת הַמִּלָּה', say: ['בּוֹאוּ נִבְנֶה אֶת הַמִּלָּה', w.w], after: w.w };
  },

  /* ---------- math ---------- */
  compare() {
    const max = L('max');
    let a, b; do { a = between(1, max); b = between(1, max); } while (Math.abs(a - b) < L('minDiff'));
    const less = L('less') && Math.random() < 0.5;
    const want = less ? Math.min(a, b) : Math.max(a, b);
    const [item] = rand(COUNT_ITEMS);
    const box = $('#choices'); box.className = 'choices groups'; box.innerHTML = '';
    for (const n of [a, b]) {
      const btn = document.createElement('button'); btn.className = 'block choice group';
      btn.textContent = Array(n).fill(item).join(' ');
      if (n === want) btn.dataset.ok = '1';
      btn.onclick = () => {
        if (S.locked) return;
        if (n === want) { btn.classList.add('right'); win(); } else { miss(btn); btn.disabled = true; }
      };
      box.appendChild(btn);
    }
    const q = less ? 'אֵיפֹה יֵשׁ פָּחוֹת?' : 'אֵיפֹה יֵשׁ יוֹתֵר?';
    return { prompt: q, say: q, after: ['כָּאן יֵשׁ', numWord(want)] };
  },

  picAdd() {
    const max = L('max'), [item, itemName] = rand(COUNT_ITEMS), minus = L('minus');
    let a, b;
    if (minus) { a = between(2, max); b = between(1, a - 1); }
    else do { a = between(1, max - 1); b = between(1, max - 1); } while (a + b > max);
    const ans = minus ? a - b : a + b;
    // the objects can be tapped to count them, like in the counting game
    let counted = 0;
    const thing = gone => {
      const t = document.createElement('button'); t.className = 'cnt' + (gone ? ' gone' : '');
      if (gone) t.innerHTML = `<span class="ghost">${item}</span>`; else t.textContent = item;
      t.onclick = () => {
        if (gone || t.classList.contains('on')) return;
        counted++; t.classList.add('on');
        const tag = document.createElement('b'); tag.textContent = counted; t.appendChild(tag);
        sfx('pop'); speak(numWord(counted));
      };
      return t;
    };
    const group = (n, goneFrom = n) => {
      const g = document.createElement('div'); g.className = 'grp';
      for (let i = 0; i < n; i++) g.appendChild(thing(i >= goneFrom));
      return g;
    };
    const op = s => { const o = document.createElement('span'); o.className = 'op'; o.textContent = s; return o; };
    const eq = document.createElement('div'); eq.className = 'eq'; eq.dir = 'ltr';
    if (minus) eq.append(group(a, a - b), op('='), op('?'));
    else eq.append(group(a), op('+'), group(b), op('='), op('?'));
    $('#stage').appendChild(eq);
    numChoices(ans, L('options'), 1, minus ? 0 : 1, 10);
    return minus
      ? { prompt: 'כַּמָּה נִשְׁאֲרוּ?', say: ['הָיוּ', numWord(a), 'לָקַחְנוּ', numWord(b), `כַּמָּה ${itemName} נִשְׁאֲרוּ?`], after: ['נִשְׁאֲרוּ', numWord(ans)] }
      : { prompt: 'כַּמָּה יֵשׁ בְּיַחַד?', say: [numWord(a), 'וְעוֹד', numWord(b), `כַּמָּה ${itemName} יֵשׁ בְּיַחַד?`], after: [numWord(a), 'וְעוֹד', numWord(b), 'זֶה', numWord(ans)] };
  },

  arith() {
    const lv = level();
    let a, b, op, ans, text, say, after;
    if (lv === 5) { // missing number: complete to 10, or a missing addend up to 20
      if (Math.random() < 0.5) { a = between(1, 9); b = 10; }
      else { a = between(2, 12); b = a + between(1, 8); }
      ans = b - a;
      text = `${a} + ? = ${b}`;
      say = [numWord(a), 'וְעוֹד כַּמָּה זֶה', numWord(b)];
      after = [numWord(a), 'וְעוֹד', numWord(ans), 'זֶה', numWord(b)];
    } else {
      if (lv === 1) { a = between(1, 4); b = between(1, 5 - a); op = '+'; }
      else if (lv === 2) { a = between(1, 9); b = between(1, 10 - a); op = '+'; }
      else if (lv === 3) { a = between(2, 10); b = between(1, a - 1); op = '−'; }
      else if (Math.random() < 0.5) { a = between(5, 15); b = between(1, 20 - a); op = '+'; }
      else { a = between(8, 20); b = between(1, a - 1); op = '−'; }
      ans = op === '+' ? a + b : a - b;
      const word = op === '+' ? 'וְעוֹד' : 'פָּחוֹת';
      text = `${a} ${op} ${b} = ?`;
      say = [numWord(a), word, numWord(b), 'כַּמָּה זֶה?'];
      after = [numWord(a), word, numWord(b), 'זֶה', numWord(ans)];
    }
    const eq = document.createElement('div'); eq.className = 'bigword equation'; eq.dir = 'ltr'; eq.textContent = text;
    $('#stage').appendChild(eq);
    if (L('dots')) { // level 1: pictures under the numbers to help
      const d = document.createElement('div'); d.className = 'dots-help'; d.dir = 'ltr';
      d.textContent = '🔵'.repeat(a) + '  +  ' + '🔴'.repeat(b);
      $('#stage').appendChild(d);
    }
    numChoices(ans, L('options'), 1, 0, 20);
    return { prompt: 'כַּמָּה זֶה?', say, after };
  },

  seq() {
    const step = L('step'), max = L('max'), size = Math.abs(step);
    const start = step > 0
      ? size * between(step === 1 ? 1 : 0, Math.floor((max - 4 * step) / size))
      : between(4 * size, max);
    const terms = Array.from({ length: 5 }, (_, i) => start + i * step);
    const hole = between(1, 4), ans = terms[hole];
    const row = document.createElement('div'); row.className = 'seq'; row.dir = 'ltr';
    terms.forEach((t, i) => {
      const c = document.createElement('span'); c.className = i === hole ? 'hole' : '';
      c.textContent = i === hole ? '?' : t;
      row.appendChild(c);
    });
    $('#stage').appendChild(row);
    numChoices(ans, L('options'), size, 0, max);
    return { prompt: 'אֵיזֶה מִסְפָּר חָסֵר?', say: 'אֵיזֶה מִסְפָּר חָסֵר?', after: terms.map(numWord) };
  },

  /* ---------- memory ---------- */
  memory() {
    const pairs = L('pairs');
    // each pair: two card faces that belong together, and what to say when they are matched
    let set;
    if (S.p === 'gan' && L('letters')) {
      set = sample(LETTERS, pairs).map(([ch, name]) => ({ a: ch, b: ch, kind: 'letter', say: name }));
    } else if (S.p === 'gan') {
      set = sample(WORDS, pairs).map(w => ({ a: w.e, b: w.e, kind: 'emo', say: w.w }));
    } else {
      const pool = wordPool(L('lens'));
      set = sample(pool.length >= pairs ? pool : WORDS, pairs).map(w => ({ a: w.w, b: w.e, kind: 'word', say: w.w }));
    }
    const cards = shuffle(set.flatMap((p, id) => [
      { id, face: p.a, kind: p.kind },
      { id, face: p.b, kind: p.kind === 'word' ? 'emo' : p.kind }
    ]));
    const box = $('#choices');
    box.className = 'memory' + (cards.length > 12 ? ' m16' : cards.length > 8 ? ' m12' : cards.length > 6 ? ' m8' : '');
    box.innerHTML = '';
    let open = [], found = 0, misses = 0;
    for (const c of cards) {
      const b = document.createElement('button');
      b.className = 'block mcard';
      b.innerHTML = `<span class="back">?</span><span class="front ${c.kind}">${c.face}</span>`;
      b.onclick = () => {
        if (S.locked || open.length === 2 || b.classList.contains('up')) return;
        b.classList.add('up'); sfx('pop');
        open.push([b, c]);
        if (open.length < 2) return;
        const [[b1, c1], [b2, c2]] = open;
        if (c1.id === c2.id) {
          open = [];
          setTimeout(() => {
            b1.classList.add('done'); b2.classList.add('done');
            found++;
            if (found === pairs) { S.firstTry = misses <= pairs; win(); }
            else { sfx('good'); speak(set[c1.id].say); }
          }, 350);
        } else {
          misses++;
          setTimeout(() => { b1.classList.remove('up'); b2.classList.remove('up'); open = []; }, 1100);
        }
      };
      box.appendChild(b);
    }
    return { prompt: 'מוֹצְאִים זוּגוֹת!', say: 'מוֹצְאִים זוּגוֹת!', stars: 2 };
  },

  /* ---------- more kindergarten games ---------- */
  colors() {
    const n = L('options');
    if (L('objects')) { // "what is red?" - pick the thing that has that color
      const withThings = COLORS.filter(c => COLOR_THINGS[c.id]);
      const [target, ...others] = sample(withThings, n);
      const thing = rand(COLOR_THINGS[target.id]);
      const opts = [{ label: thing, ok: true }, ...others.map(c => ({ label: rand(COLOR_THINGS[c.id]) }))];
      choices(opts, 'emo');
      return { prompt: `מָה בְּצֶבַע ${target.name}?`, say: `מָה בְּצֶבַע ${target.name}?`, after: WORD_BY_EMOJI[thing] || target.name };
    }
    const [target, ...others] = sample(COLORS.slice(0, L('pool')), n);
    const box = $('#choices'); box.className = 'choices' + (n === 4 ? ' n4' : n === 2 ? ' n2' : ''); box.innerHTML = '';
    for (const c of shuffle([target, ...others])) {
      const b = document.createElement('button');
      b.className = 'block choice swatch';
      b.style.setProperty('--c', c.hex);
      b.setAttribute('aria-label', c.name);
      if (c === target) b.dataset.ok = '1';
      b.onclick = () => { if (S.locked) return; if (c === target) { b.classList.add('right'); win(); } else { miss(b); b.disabled = true; } };
      box.appendChild(b);
    }
    return { prompt: `אֵיפֹה הַצֶּבַע ${target.the}?`, say: `אֵיפֹה הַצֶּבַע ${target.the}?`, after: target.name };
  },

  shapes() {
    const n = L('options'), pool = SHAPES.slice(0, L('pool'));
    const draw = (sh, color) => `<svg viewBox="0 0 100 100" aria-hidden="true"><g fill="${color}" stroke="#1F2A44" stroke-width="4" stroke-linejoin="round">${sh.svg}</g></svg>`;
    let target, tColor, opts;
    if (L('colorMix')) { // "where is the blue circle?" - same shape in other colors, other shapes in the same color
      const cols = COLORS.slice(0, 4);
      target = rand(pool); tColor = rand(cols);
      // half the wrong answers are the same shape in another color, half another shape in the same color
      const sameShape = shuffle(cols.filter(c => c !== tColor)).map(c => [target, c]);
      const sameColor = shuffle(pool.filter(sh => sh !== target)).map(sh => [sh, tColor]);
      opts = [[target, tColor]];
      while (opts.length < n) opts.push((opts.length % 2 ? sameShape : sameColor).shift() || sameColor.shift() || sameShape.shift());
    } else {
      const picked = sample(pool, n); target = picked[0];
      const color = rand(COLORS.slice(0, 4)).hex; // all the same color, so only the shape differs
      opts = picked.map(sh => [sh, { hex: color }]);
      tColor = null;
    }
    const box = $('#choices'); box.className = 'choices' + (n === 4 ? ' n4' : n === 2 ? ' n2' : ''); box.innerHTML = '';
    for (const [sh, c] of shuffle(opts)) {
      const b = document.createElement('button');
      b.className = 'block choice shape';
      b.innerHTML = draw(sh, c.hex);
      const ok = sh === target && (!tColor || c === tColor);
      if (ok) b.dataset.ok = '1';
      b.onclick = () => { if (S.locked) return; if (ok) { b.classList.add('right'); win(); } else { miss(b); b.disabled = true; } };
      box.appendChild(b);
    }
    const q = tColor ? `אֵיפֹה ${target.the} ${tColor.the}?` : `אֵיפֹה ${target.the}?`;
    return { prompt: q, say: q, after: tColor ? `${target.name} ${tColor.name}` : target.name };
  },

  pattern() {
    const form = rand(L('forms'));                      // e.g. 'AAB'
    const kinds = [...new Set(form)].length;
    const items = sample(PATTERN_ITEMS, kinds);
    const seq = [];
    for (let i = 0; seq.length < Math.max(6, form.length * 2) + 1; i++) seq.push(items[form.charCodeAt(i % form.length) - 65]);
    const answer = seq.pop();
    const row = document.createElement('div'); row.className = 'pattern' + (seq.length > 6 ? ' long' : ''); row.dir = 'rtl';
    row.innerHTML = seq.map(e => `<span>${e}</span>`).join('') + '<span class="hole">?</span>';
    $('#stage').appendChild(row);
    const extra = sample(PATTERN_ITEMS.filter(e => !items.includes(e)), Math.max(0, L('options') - kinds));
    const opts = [...new Set([answer, ...items, ...extra])].slice(0, L('options'));
    choices(opts.map(e => ({ label: e, ok: e === answer })), 'emo');
    return { prompt: 'מָה בָּא אַחַר כָּךְ?', say: 'מָה בָּא אַחַר כָּךְ?', after: WORD_BY_EMOJI[answer] };
  },

  shadow() {
    const w = pickWord(WORDS);
    const shade = document.createElement('div'); shade.className = 'pic shadow'; shade.innerHTML = `<span class="sil">${w.e}</span>`;
    $('#stage').appendChild(shade);
    const group = SHADOW_GROUPS.find(g => g.includes(w.e));
    let pool = WORDS.filter(x => x.e !== w.e);
    if (L('similar') && group) { const same = pool.filter(x => group.includes(x.e)); if (same.length >= L('options')) pool = same; }
    const others = sample(pool, L('options') - 1);
    choices([{ label: w.e, ok: true }, ...others.map(x => ({ label: x.e }))], 'emo');
    return { prompt: 'שֶׁל מִי הַצֵּל הַזֶּה?', say: 'שֶׁל מִי הַצֵּל הַזֶּה?', after: w.w };
  },

  /* ---------- more first-grade games ---------- */
  syllables() {
    const [lo, hi] = L('range');
    const pool = WORDS.filter(w => !SYLLABLE_SKIP.includes(w.w) && !/^.[ְ]/.test(w.w.replace(/[ּׁׂ]/g, '')) && syllableCount(w) >= lo && syllableCount(w) <= hi);
    const w = pickWord(pool);
    picture(w, true);
    const big = document.createElement('div'); big.className = 'bigword small'; big.textContent = w.w;
    $('#stage').appendChild(big);
    const n = syllableCount(w);
    numChoices(n, L('options'), 1, 1, 5);
    return { prompt: 'כַּמָּה הֲבָרוֹת? מוֹחֲאִים כַּפַּיִם 👏', say: ['כַּמָּה הֲבָרוֹת יֵשׁ בַּמִּלָּה', w.w], after: [w.w, numWord(n)] };
  },

  missing() {
    const w = pickWord(wordPool(L('lens')).filter(x => x.chunks.length >= 2));
    picture(w, true);
    const hole = between(0, w.chunks.length - 1), ans = w.chunks[hole];
    const slots = document.createElement('div'); slots.className = 'slots' + (w.chunks.length > 5 ? ' many' : '');
    w.chunks.forEach((c, i) => {
      const s = document.createElement('div'); s.className = 'slot' + (i === hole ? '' : ' full shown'); s.textContent = i === hole ? '?' : c;
      slots.appendChild(s);
    });
    $('#stage').appendChild(slots);
    // wrong answers: the same letter with another vowel, and other letters with the same vowel
    const base = baseOf(ans), v = vowelClass(ans), n = L('options');
    const opts = new Set([ans]);
    const FINALS = 'ךםןףץ';
    if (FINALS.includes(ans[0]) || !v) {
      const letters = FINALS.includes(ans[0]) ? FINALS.split('') : ['ל', 'מ', 'נ', 'ר', 'ד', 'ת', 'ש', 'ב'];
      for (const x of shuffle(letters.filter(x => x !== ans[0] && !soundsAlike(x, ans[0])))) { if (opts.size >= n) break; opts.add(x); }
    } else {
      for (const ov of shuffle(Object.keys(VOWEL).filter(x => x !== v))) { if (opts.size >= Math.ceil(n / 2) + 1) break; opts.add(base + VOWEL[ov]); }
      const others = ['מ', 'ל', 'נ', 'ר', 'ד', 'ג', 'ז', 'י', 'ס', 'ה', 'שׁ', 'ק', 'צ'].filter(x => x[0] !== base[0] && !soundsAlike(x[0], base[0]));
      while (opts.size < n) opts.add(rand(others) + VOWEL[v]);
    }
    choices([...opts].map(o => ({ label: o, ok: o === ans })));
    return { prompt: 'אֵיזוֹ אוֹת חֲסֵרָה?', say: ['אֵיזוֹ אוֹת חֲסֵרָה בַּמִּלָּה', w.w], after: w.w };
  },

  sentences() {
    const pool = SENTENCES.filter(x => x.level <= L('maxLevel'));
    const t = pickWord(pool.map(x => ({ w: x.text, e: x.pic, subj: x.subj })));
    const big = document.createElement('div'); big.className = 'bigword sentence'; big.textContent = t.w;
    $('#stage').appendChild(big);
    let others = [];
    if (L('sameSubject')) others = sample(SENTENCES.filter(x => x.subj === t.subj && x.text !== t.w), L('options') - 1);
    others = others.concat(sample(SENTENCES.filter(x => x.text !== t.w && !others.includes(x) && x.pic !== t.e), L('options') - 1 - others.length));
    choices([{ label: t.e, ok: true }, ...others.map(x => ({ label: x.pic }))], 'emo');
    return { prompt: 'אֵיזוֹ תְּמוּנָה מַתְאִימָה לַמִּשְׁפָּט?', say: 'אֵיזוֹ תְּמוּנָה מַתְאִימָה לַמִּשְׁפָּט?', after: t.w };
  },

  numCompare() {
    const lv = level();
    const side = max => { // a number, or at levels 4-5 a small sum
      if (lv >= 4 && Math.random() < 0.6) { const a = between(1, max - 1), b = between(1, max - a); return { text: `${a} + ${b}`, val: a + b }; }
      const v = between(0, max); return { text: String(v), val: v };
    };
    const max = [10, 20, 100, 10, 20][lv - 1];
    let A = side(max), B;
    if (Math.random() < 0.25) B = lv >= 4 && Math.random() < 0.5 ? side(max) : { text: String(A.val), val: A.val };
    else B = side(max);
    if (lv === 5 && !A.text.includes('+') && !B.text.includes('+')) { const a = between(1, 9), b = between(1, 10 - a); A = { text: `${a} + ${b}`, val: a + b }; }
    const sign = A.val > B.val ? '>' : A.val < B.val ? '<' : '=';
    const eq = document.createElement('div'); eq.className = 'bigword equation cmp'; eq.dir = 'ltr';
    eq.textContent = `${A.text}  ◯  ${B.text}`;
    $('#stage').appendChild(eq);
    if (L('dots')) {
      const d = document.createElement('div'); d.className = 'dots-help'; d.dir = 'ltr';
      d.textContent = '🔵'.repeat(A.val) + '   ' + '🔴'.repeat(B.val);
      $('#stage').appendChild(d);
    }
    choices(['>', '<', '='].map(x => ({ label: x, ok: x === sign })), 'sign');
    const word = { '>': 'גָּדוֹל מִן', '<': 'קָטָן מִן', '=': 'שָׁוֶה לְ' }[sign];
    return { prompt: 'אֵיזֶה סִימָן מַתְאִים?', say: 'אֵיזֶה סִימָן מַתְאִים?', after: [numWord(A.val), word, numWord(B.val)] };
  }
};

    'אֵיזוֹ תְּמוּנָה מַתְאִימָה לַמִּלָּה?', 'אֵיזוֹ מִלָּה מַתְאִימָה לַתְּמוּנָה?', 'אֵיזֶה מִסְפָּר חָסֵר?',

    ...COLORS.map(c => `אֵיפֹה הַצֶּבַע ${c.the}?`), ...COLORS.map(c => c.name),

    ...SHAPES.map(sh => `אֵיפֹה ${sh.the}?`), ...SHAPES.map(sh => sh.name),
    ...SHAPES.slice(0, 5).flatMap(sh => COLORS.slice(0, 4).map(c => `אֵיפֹה ${sh.the} ${c.the}?`)),
    ...SHAPES.slice(0, 5).flatMap(sh => COLORS.slice(0, 4).map(c => `${sh.name} ${c.name}`)),
    'מָה בָּא אַחַר כָּךְ?', 'שֶׁל מִי הַצֵּל הַזֶּה?',
    'כַּמָּה הֲבָרוֹת יֵשׁ בַּמִּלָּה', 'אֵיזוֹ אוֹת חֲסֵרָה בַּמִּלָּה', 'אֵיזוֹ תְּמוּנָה מַתְאִימָה לַמִּשְׁפָּט?', ...SENTENCES.map(x => x.text),
    'אֵיזֶה סִימָן מַתְאִים?', 'גָּדוֹל מִן', 'קָטָן מִן', 'שָׁוֶה לְ',
    ...Object.values(PLAYERS).map(p => p.turn), 'בְּיַחַד הִצְלַחְתֶּם!',

  ])];
